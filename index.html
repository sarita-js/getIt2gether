<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deadline — College Task Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Notification toasts: fixed to viewport, always on top regardless of tab -->
<div class="notif-container" id="notif-container"></div>

<!-- Add Task Modal: fixed to viewport -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="modal-title">Add New Task</div>
    <div class="form-group">
      <label class="form-label">Task Name</label>
      <input class="form-input" id="input-name" placeholder="e.g. Research Paper Draft"/>
    </div>
    <div class="form-group">
      <label class="form-label">Category</label>
      <select class="form-select" id="input-cat">
        <option>School</option>
        <option>Work</option>
        <option>Personal</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Course / Job</label>
      <input class="form-input" id="input-course" placeholder="e.g. PSYCH 201 or Café Shift"/>
    </div>
    <div class="form-group">
      <label class="form-label">Type</label>
      <select class="form-select" id="input-type">
        <option>Assignment</option>
        <option>Exam</option>
        <option>Quiz</option>
        <option>Project</option>
        <option>Reading</option>
        <option>Work Shift</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Due Date</label>
      <input class="form-input" type="date" id="input-due"/>
    </div>
    <div class="form-group">
      <label class="form-label">Priority</label>
      <select class="form-select" id="input-priority">
        <option>High</option>
        <option>Medium</option>
        <option>Low</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()" style="flex:1">Cancel</button>
      <button class="btn btn-primary" onclick="saveTask()" style="flex:2">
        <i class="ti ti-check" aria-hidden="true"></i> Save Task
      </button>
    </div>
  </div>
</div>

<div class="app-wrapper">
  <div class="app-shell">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="app-logo">
        <div class="logo-name" id="app-logo-name">Deadline</div>
        <div class="logo-tagline" id="app-tagline">your academic co-pilot</div>
      </div>

      <div class="sidebar-section-label" style="margin-bottom:8px">Overview</div>
      <div class="nav-item active" id="nav-dashboard" onclick="switchView('dashboard', this)">
        <i class="ti ti-layout-dashboard" aria-hidden="true"></i> Dashboard
      </div>
      <div class="nav-item" id="nav-tasks" onclick="switchView('tasks', this)">
        <i class="ti ti-checklist" aria-hidden="true"></i> All Tasks
        <span class="nav-badge" id="badge-all">0</span>
      </div>
      <div class="nav-item" id="nav-upcoming" onclick="switchView('upcoming', this)">
        <i class="ti ti-calendar-event" aria-hidden="true"></i> Upcoming
      </div>
      <div class="nav-item" id="nav-work" onclick="switchView('work', this)">
        <i class="ti ti-briefcase" aria-hidden="true"></i> Work Shifts
      </div>
      <div class="nav-item" id="nav-notifs" onclick="switchView('notifs', this)">
        <i class="ti ti-bell" aria-hidden="true"></i> Notifications
        <span class="nav-badge" style="background:var(--p-warn);color:#1a1000" id="badge-notifs">NEW</span>
      </div>

      <div class="sidebar-spacer"></div>

      <!-- Vibe switcher always anchored at the bottom of the sidebar -->
      <div class="personality-switcher">
        <div class="switcher-label">Vibe</div>
        <div class="personality-pills">
          <div class="p-pill active" onclick="setPersonality('default')" id="pill-default">🌌 Night Owl</div>
          <div class="p-pill" onclick="setPersonality('zen')" id="pill-zen">🌿 Zen Mode</div>
          <div class="p-pill" onclick="setPersonality('grind')" id="pill-grind">⚡ Grind Set</div>
          <div class="p-pill" onclick="setPersonality('bubbly')" id="pill-bubbly">🌸 Bubbly</div>
        </div>
      </div>
    </div>

    <!-- MAIN -->
    <div class="main">
      <div class="topbar">
        <div class="topbar-title" id="view-title">Dashboard</div>
        <div class="topbar-greeting" id="topbar-greeting">Hey, you've got this 👊</div>
        <button class="btn btn-notif" onclick="fireRandomMeme()" style="margin-right:4px">
          <i class="ti ti-bell" aria-hidden="true"></i> Test Notif
        </button>
        <button class="btn btn-primary" onclick="openModal()">
          <i class="ti ti-plus" aria-hidden="true"></i> Add Task
        </button>
      </div>
      <div class="content-area" id="content-area"></div>
    </div>

  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────

const MEME_PACKS = {

      { bg: '😭', top: 'THE MOMENT I REALIZE', bot: "IT'S ALREADY WEDNESDAY" },
      { bg: '🦆', top: 'PROFESSOR SAYS "EASY ASSIGNMENT"', bot: 'TAKES 6 HOURS' },
      { bg: '🤡', top: 'ME THINKING I COULD', bot: 'DO IT TOMORROW' },
    ],
  },
  motivational: {
    name: 'Hype Beast', emoji: '💪', desc: 'Pure pump-up energy', color: '#7c6af7',

      { bg: '🦁', top: "YOU DIDN'T COME THIS FAR", bot: 'TO ONLY COME THIS FAR' },
      { bg: '🚀', top: 'FUTURE YOU IS DEPENDING', bot: 'ON PRESENT YOU. DO IT.' },
      { bg: '💎', top: "THE ASSIGNMENT WON'T", bot: "DO ITSELF. LET'S GO." },
      { bg: '⚡', top: 'ONE TASK DOWN.', bot: "YOU'RE UNSTOPPABLE." },
      { bg: '🏆', top: 'FINISH THIS. THEN', bot: 'GO CELEBRATE. YOU EARNED IT.' },

  },

      { bg: '⭐', top: 'WHEN THE ESSAY', bot: 'IS DUE AT MIDNIGHT' },

      { bg: '🐌', top: 'MY PRODUCTIVITY', bot: 'AFTER 9PM' },

    ],
  },
  sigma: {
    name: 'Sigma Grindset', emoji: '😤', desc: 'No excuses, all output', color: '#39ff14',
    memes: [

      { bg: '📚', top: 'SLEEP IS FOR THE', bot: 'ALREADY GRADUATED.' },
      { bg: '🐺', top: 'LONE WOLF DOES THE', bot: 'ASSIGNMENT FIRST TRY.' },
      { bg: '⚔️', top: 'YOUR DEADLINE IS NOT', bot: 'YOUR ENEMY. LAZINESS IS.' },

    ],

  cozy: {

    memes: [

      { bg: '🧸', top: 'YOU GOT THIS!!', bot: 'THE HOMEWORK IS NOT SCARY 💕' },
      { bg: '☕', top: 'DRINK SOME WATER.', bot: 'THEN DO THE THING 🌷' },
      { bg: '🌈', top: 'SMALL STEPS ARE STILL', bot: "STEPS. YOU'RE DOING GREAT!" },
      { bg: '🦋', top: 'OPEN THE DOCUMENT.', bot: "THAT'S LITERALLY STEP ONE 💖" },

    ],
  },
  corporate: {
    name: 'Corporate Meme', emoji: '💼', desc: 'LinkedIn meets chaos', color: '#0077b5',
    memes: [
      { bg: '💼', top: '"I\'M A HARD WORKER"', bot: 'ALSO ME: 47 TABS OPEN' },
      { bg: '📊', top: 'SYNERGIZING YOUR', bot: 'PROCRASTINATION INTO ACTION' },
      { bg: '🤝', top: 'PLEASE SEE ATTACHED', bot: '(I HAVE NOT ATTACHED IT)' },
      { bg: '📈', top: 'QUARTERLY RESULTS:', bot: 'ZERO ASSIGNMENTS DONE' },
      { bg: '☕', top: 'PER MY LAST EMAIL', bot: 'PLEASE DO YOUR HOMEWORK' },
      { bg: '🖨️', top: '"CIRCLE BACK ON THAT"', bot: '-ME ABOUT MY ESSAY' },
    ],
  },
};

// ── STATE ─────────────────────────────────────────────────────────────────────

let currentPersonality = 'default';
let currentView = 'dashboard';
let currentFilter = 'All';
let notifSettings = {
  enabled: true,
  interval: 30,
  selectedPack: 'chaos',
  urgentOnly: false,
  sound: false,
};
let notifLog = [];
let notifTimer = null;
let nextId = 100;
let tasks = [];

// ── HELPERS ───────────────────────────────────────────────────────────────────

function makeDateStr(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().split('T')[0];
}

const today = new Date();
today.setHours(0, 0, 0, 0);

function daysUntil(s) {
  const d = new Date(s);
  d.setHours(0, 0, 0, 0);
  return Math.round((d - today) / 86400000);
}

function urgencyClass(days, done) {
  if (done) return 'done';
  if (days <= 2) return 'urgent';
  if (days <= 5) return 'soon';
  return 'ok';
}

function dueLabel(days, done) {
  if (done) return 'Done ✓';
  if (days < 0) return `${Math.abs(days)}d overdue`;
  if (days === 0) return 'Due today!';
  if (days === 1) return 'Due tomorrow';
  return `In ${days} days`;
}

function dueClass(days, done) {
  if (done) return 'due-ok';
  if (days <= 0) return 'due-urgent';
  if (days <= 5) return 'due-soon';
  return 'due-ok';
}

// ── INIT ──────────────────────────────────────────────────────────────────────

function initTasks() {
  tasks = [
    { id: 1, name: 'Research Paper Draft',    cat: 'School', course: 'ENG 302',      type: 'Assignment', due: makeDateStr(1),  priority: 'High',   done: false },
    { id: 2, name: 'Midterm Exam Study Guide', cat: 'School', course: 'CHEM 201',     type: 'Exam',       due: makeDateStr(3),  priority: 'High',   done: false },
    { id: 3, name: 'Group Project Slides',     cat: 'School', course: 'BUS 450',      type: 'Project',    due: makeDateStr(5),  priority: 'Medium', done: false },
    { id: 4, name: 'Evening Café Shift',       cat: 'Work',   course: 'Campus Café',  type: 'Work Shift', due: makeDateStr(0),  priority: 'High',   done: false },
    { id: 5, name: 'Reading Ch. 7-9',          cat: 'School', course: 'PSYCH 110',    type: 'Reading',    due: makeDateStr(7),  priority: 'Low',    done: true  },
    { id: 6, name: 'Weekly Quiz',              cat: 'School', course: 'STAT 200',     type: 'Quiz',       due: makeDateStr(-1), priority: 'High',   done: false },
    { id: 7, name: 'Saturday Open Shift',      cat: 'Work',   course: 'Target',       type: 'Work Shift', due: makeDateStr(6),  priority: 'Medium', done: false },
    { id: 8, name: 'Lab Report',               cat: 'School', course: 'BIO 105',      type: 'Assignment', due: makeDateStr(9),  priority: 'Medium', done: false },
  ];
}

// ── PERSONALITY ───────────────────────────────────────────────────────────────

function setPersonality(p) {
  const body = document.body;
  Object.values(PERSONALITIES).forEach(v => { if (v.bodyClass) body.classList.remove(v.bodyClass); });
  const cfg = PERSONALITIES[p];
  if (cfg.bodyClass) body.classList.add(cfg.bodyClass);
  currentPersonality = p;
  document.getElementById('app-logo-name').textContent = cfg.logoName;
  document.getElementById('app-tagline').textContent = cfg.tagline;
  document.getElementById('topbar-greeting').textContent = cfg.greeting;
  document.getElementById('modal-title').textContent = cfg.modalTitle;
  document.querySelectorAll('.p-pill').forEach(el => el.classList.remove('active'));
  document.getElementById('pill-' + p).classList.add('active');
  renderContent();
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────

function switchView(v, el) {
  currentView = v;
  document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
  if (el) el.classList.add('active');
  const titles = { dashboard: 'Dashboard', tasks: 'All Tasks', upcoming: 'Upcoming', work: 'Work Shifts', notifs: 'Notifications' };
  document.getElementById('view-title').textContent = titles[v] || v;
  if (v === 'notifs') document.getElementById('badge-notifs').textContent = '🔔';
  currentFilter = 'All';
  // Scroll back to top when switching tabs
  document.getElementById('content-area').scrollIntoView({ block: 'start', behavior: 'instant' });
  renderContent();
}

// ── MODAL ─────────────────────────────────────────────────────────────────────

function openModal() {
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('input-due').value = makeDateStr(3);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function saveTask() {
  const name = document.getElementById('input-name').value.trim();
  if (!name) return;
  tasks.unshift({
    id: nextId++,
    name,
    cat: document.getElementById('input-cat').value,
    course: document.getElementById('input-course').value || '—',
    type: document.getElementById('input-type').value,
    due: document.getElementById('input-due').value,
    priority: document.getElementById('input-priority').value,
    done: false,
  });
  document.getElementById('input-name').value = '';
  document.getElementById('input-course').value = '';
  closeModal();
  renderContent();
}

function toggleDone(id) {
  const t = tasks.find(t => t.id === id);
  if (t) { t.done = !t.done; renderContent(); }
}

// ── RENDER HELPERS ────────────────────────────────────────────────────────────

function renderTaskCard(t) {
  const days = daysUntil(t.due);
  const urg = urgencyClass(days, t.done);
  const dl  = dueLabel(days, t.done);
  const dc  = dueClass(days, t.done);
  return `
    <div class="task-card ${urg}" onclick="toggleDone(${t.id})">
      <div class="task-check ${t.done ? 'checked' : ''}">
        ${t.done ? '<i class="ti ti-check" style="font-size:11px;color:var(--p-bg)" aria-hidden="true"></i>' : ''}
      </div>
      <div class="task-info">
        <div class="task-name">${t.name}</div>
        <div class="task-meta">
          <span class="task-course">${t.course}</span>
          <span class="task-type-badge">${t.type}</span>
          <span class="task-type-badge">${t.cat}</span>
        </div>
      </div>
      <div class="task-right">
        <span class="task-due ${dc}">${dl}</span>
        <span style="font-size:10px;color:var(--p-muted)">${t.priority} priority</span>
      </div>
    </div>`;
}

function renderNotifSettings() {
  const packCards = Object.entries(MEME_PACKS).map(([k, v]) => `
    <div class="meme-pack-card ${notifSettings.selectedPack === k ? 'selected' : ''}" onclick="selectPack('${k}')">
      <div class="pack-emoji">${v.emoji}</div>
      <div class="pack-name">${v.name}</div>
      <div class="pack-desc">${v.desc}</div>
    </div>`).join('');

  const intervals = [10, 30, 60, 120];
  const intervalBtns = intervals.map(i =>
    `<button class="interval-btn ${notifSettings.interval === i ? 'active' : ''}" onclick="setInterval2(${i})">${i < 60 ? i + 'm' : i / 60 + 'h'}</button>`
  ).join('');

  const logItems = notifLog.slice(-5).reverse().map(l =>
    `<div class="log-item"><span class="log-time">${l.time}</span><span class="log-msg">${l.meme.bg} ${l.meme.bot}</span><span class="log-pack">${l.pack}</span></div>`
  ).join('');

  return `
    <div class="section-header"><span class="section-title">🔔 Notification Settings</span><div class="section-sep"></div></div>
    <div class="settings-panel">
      <div class="settings-row">
        <div>
          <div class="settings-label">Enable meme notifications</div>
          <div class="settings-sub">Get roasted into productivity</div>
        </div>
        <div class="toggle ${notifSettings.enabled ? 'on' : ''}" onclick="toggleSetting('enabled')"><div class="toggle-knob"></div></div>
      </div>
      <div class="settings-row">
        <div>
          <div class="settings-label">Urgent tasks only</div>
          <div class="settings-sub">Only notify for tasks due within 2 days</div>
        </div>
        <div class="toggle ${notifSettings.urgentOnly ? 'on' : ''}" onclick="toggleSetting('urgentOnly')"><div class="toggle-knob"></div></div>
      </div>
    </div>

    <div class="section-header" style="margin-top:4px"><span class="section-title">🎭 Choose Your Meme Pack</span><div class="section-sep"></div></div>
    <div class="meme-pack-grid">${packCards}</div>

    <div class="section-header"><span class="section-title">⏱ Reminder Interval</span><div class="section-sep"></div></div>
    <div class="settings-panel" style="padding:14px 18px">
      <div class="interval-row">${intervalBtns}</div>
    </div>

    <button class="preview-btn" onclick="fireRandomMeme()">
      <i class="ti ti-player-play" aria-hidden="true"></i> Preview a Notification Now
    </button>

    ${notifLog.length ? `
      <div class="section-header" style="margin-top:16px">
        <span class="section-title">📋 Recent Notifications</span>
        <div class="section-sep"></div>
      </div>
      <div class="notif-log">${logItems}</div>` : ''}
  `;
}

// ── MAIN RENDER ───────────────────────────────────────────────────────────────

function renderContent() {
  const area = document.getElementById('content-area');
  const cfg = PERSONALITIES[currentPersonality];
  const pending = tasks.filter(t => !t.done);
  const urgent = pending.filter(t => daysUntil(t.due) <= 2);
  const done = tasks.filter(t => t.done);
  const pct = tasks.length ? Math.round(done.length / tasks.length * 100) : 0;

  document.getElementById('badge-all').textContent = pending.length;

  if (currentView === 'notifs') {
    area.innerHTML = renderNotifSettings();
    return;
  }

  let html = '';

  if (currentView === 'dashboard') {
    html += `
      <div class="stats-row">
        <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value stat-accent">${pending.length}</div><div class="stat-sub">tasks remaining</div></div>
        <div class="stat-card"><div class="stat-label">Urgent</div><div class="stat-value stat-danger">${urgent.length}</div><div class="stat-sub">due within 2 days</div></div>
        <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value stat-success">${done.length}</div><div class="stat-sub">${pct}% of all tasks</div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>
        <div class="stat-card"><div class="stat-label">Work Shifts</div><div class="stat-value stat-warn">${pending.filter(t => t.cat === 'Work').length}</div><div class="stat-sub">scheduled</div></div>
      </div>
      <div class="motivation-banner"><i class="ti ti-sparkles banner-icon" aria-hidden="true"></i><span>${cfg.bannerMsg}</span></div>`;

    if (urgent.length) {
      html += `<div class="section-header"><span class="section-title">🚨 Urgent — Act Now</span><div class="section-sep"></div></div><div class="task-list">${urgent.map(renderTaskCard).join('')}</div>`;
    }

    const school = pending.filter(t => t.cat === 'School' && daysUntil(t.due) > 2).slice(0, 3);
    if (school.length) {
      html += `<div class="section-header"><span class="section-title">📚 School Deadlines</span><div class="section-sep"></div></div><div class="task-list">${school.map(renderTaskCard).join('')}</div>`;
    }

    const work = pending.filter(t => t.cat === 'Work').slice(0, 2);
    if (work.length) {
      html += `<div class="section-header"><span class="section-title">💼 Work Shifts</span><div class="section-sep"></div></div><div class="task-list">${work.map(renderTaskCard).join('')}</div>`;
    }

  } else if (currentView === 'tasks' || currentView === 'upcoming') {
    const filters = ['All', 'School', 'Work', 'Personal'];
    html += `<div class="filter-tabs">${filters.map(f =>
      `<div class="filter-tab ${currentFilter === f ? 'active' : ''}" onclick="currentFilter='${f}';renderContent()">${f}</div>`
    ).join('')}</div>`;

    let filtered = currentView === 'upcoming'
      ? tasks.filter(t => !t.done && daysUntil(t.due) >= 0).sort((a, b) => new Date(a.due) - new Date(b.due))
      : tasks;

    if (currentFilter !== 'All') filtered = filtered.filter(t => t.cat === currentFilter);

    if (!filtered.length) {
      html += `<div class="empty-state"><i class="ti ti-mood-smile" style="font-size:28px;display:block;margin-bottom:8px" aria-hidden="true"></i>Nothing here yet!</div>`;
    } else {
      const sections = [
        { label: 'Overdue',              items: filtered.filter(t => !t.done && daysUntil(t.due) < 0) },
        { label: 'Due Today & Tomorrow', items: filtered.filter(t => !t.done && daysUntil(t.due) >= 0 && daysUntil(t.due) <= 1) },
        { label: 'This Week',            items: filtered.filter(t => !t.done && daysUntil(t.due) >= 2 && daysUntil(t.due) <= 7) },
        { label: 'Later',                items: filtered.filter(t => !t.done && daysUntil(t.due) > 7) },
        { label: 'Completed',            items: filtered.filter(t => t.done) },
      ].filter(s => s.items.length);

      sections.forEach(s => {
        html += `<div class="section-header"><span class="section-title">${s.label}</span><div class="section-sep"></div></div>
                 <div class="task-list">${s.items.map(renderTaskCard).join('')}</div>`;
      });
    }

  } else if (currentView === 'work') {
    const w = tasks.filter(t => t.cat === 'Work');
    if (!w.length) {
      html += `<div class="empty-state"><i class="ti ti-briefcase" style="font-size:28px;display:block;margin-bottom:8px" aria-hidden="true"></i>No work shifts yet.</div>`;
    } else {
      html += `<div class="section-header"><span class="section-title">Work Schedule</span><div class="section-sep"></div></div>
               <div class="task-list">${w.sort((a, b) => new Date(a.due) - new Date(b.due)).map(renderTaskCard).join('')}</div>`;
    }
  }

  area.innerHTML = html;
}

// ── NOTIFICATION CONTROLS ─────────────────────────────────────────────────────

function selectPack(k) {
  notifSettings.selectedPack = k;
  renderContent();
}

function setInterval2(i) {
  notifSettings.interval = i;
  restartTimer();
  renderContent();
}

function toggleSetting(k) {
  notifSettings[k] = !notifSettings[k];
  if (k === 'enabled') {
    notifSettings.enabled ? restartTimer() : clearInterval(notifTimer);
  }
  renderContent();
}

// ── TOAST NOTIFICATIONS ───────────────────────────────────────────────────────

let toastCount = 0;

function fireRandomMeme(task) {
  if (!notifSettings.enabled) return;
  const pack = MEME_PACKS[notifSettings.selectedPack];
  const meme = pack.memes[Math.floor(Math.random() * pack.memes.length)];

  const pending = tasks.filter(t => !t.done);
  const urgent = pending.filter(t => daysUntil(t.due) <= 2);
  const targetTasks = notifSettings.urgentOnly ? urgent : pending;
  const relatedTask = targetTasks.length ? targetTasks[Math.floor(Math.random() * targetTasks.length)] : null;

  const now = new Date();
  const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
  notifLog.push({ time: timeStr, meme, pack: pack.name });

  const id = 'toast-' + (++toastCount);
  const bgColor = pack.color + '22';
  const borderAccent = pack.color;

  const taskText = relatedTask
    ? `"${relatedTask.name}" ${daysUntil(relatedTask.due) <= 0 ? 'is OVERDUE' : 'due ' + dueLabel(daysUntil(relatedTask.due), false).toLowerCase()}`
    : 'You have tasks waiting on you...';

  const html = `
    <div class="notif-toast" id="${id}">
      <div class="notif-header">
        <div class="notif-app-icon" style="background:${pack.color}">D</div>
        <span class="notif-app-name">Deadline</span>
        <span class="notif-time">now</span>
        <button class="notif-dismiss" onclick="dismissToast('${id}')" aria-label="Dismiss">
          <i class="ti ti-x" style="font-size:12px"></i>
        </button>
      </div>
      <div class="notif-meme-zone">
        <div class="meme-canvas" style="background:${bgColor};border:1.5px solid ${borderAccent}33">
          <div class="meme-bg">${meme.bg}</div>
          <div class="meme-top-text">${meme.top}</div>
          <div class="meme-bot-text">${meme.bot}</div>
        </div>
        <div class="notif-body-text">${taskText}</div>
      </div>
      <div class="notif-actions">
        <button class="notif-action" onclick="dismissToast('${id}');switchView('tasks',document.getElementById('nav-tasks'))">View Tasks</button>
        <button class="notif-action dismiss" onclick="dismissToast('${id}')">Dismiss</button>
      </div>
    </div>`;

  const container = document.getElementById('notif-container');
  container.insertAdjacentHTML('beforeend', html);
  const el = document.getElementById(id);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  setTimeout(() => dismissToast(id), 8000);
}

function dismissToast(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('hide');
  el.classList.remove('show');
  setTimeout(() => el.remove(), 300);
}

function restartTimer() {
  if (notifTimer) clearInterval(notifTimer);
  if (notifSettings.enabled) {
    notifTimer = setInterval(() => {
      const pending = tasks.filter(t => !t.done);
      const urgent = pending.filter(t => daysUntil(t.due) <= 2);
      if (notifSettings.urgentOnly && !urgent.length) return;
      if (pending.length) fireRandomMeme();
    }, notifSettings.interval * 1000);
  }
}

// ── BOOT ──────────────────────────────────────────────────────────────────────

initTasks();
renderContent();
restartTimer();
setTimeout(() => fireRandomMeme(), 2200);
</script>

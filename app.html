<!DOCTYPE html>

<div class="notif-container" id="notif-container"></div>

<!-- Add / Edit Task Modal -->
<div class="modal-overlay" id="modal-overlay">

    </div>
    <div class="form-group">
      <label class="form-label" id="label-cat">Category</label>
      <select class="form-select" id="input-cat"></select>
    </div>
    <div class="form-group">
      <label class="form-label" id="label-detail">Course / Location / Detail</label>
      <input class="form-input" id="input-course" placeholder="e.g. PSYCH 201, Café Shift, Dr. Patel…"/>
    </div>

      <label class="form-label">Type</label>
      <select class="form-select" id="input-type">

        <option>Quiz</option>
        <option>Project</option>
        <option>Reading</option>

        <option>Errand</option>

    </div>
    <div class="form-group">

    </div>
    <div class="form-group">
      <label class="form-label">Priority</label>
      <select class="form-select" id="input-priority">
        <option>High</option>
        <option>Medium</option>
        <option>Low</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()" style="flex:1">Cancel</button>
      <button class="btn btn-primary" onclick="saveTask()" style="flex:2">
        <i class="ti ti-check" aria-hidden="true"></i> <span id="modal-save-label">Save Task</span>
      </button>
    </div>
  </div>
</div>

let currentUser = null;

let currentView = 'dashboard';
let currentFilter = 'All';
let notifSettings = {
  enabled: true,
  interval: 30,
  selectedPack: 'chaos',
  urgentOnly: false,
  osEnabled: false,
};
let notifLog = [];

let nextId = 1;
let tasks = [];
let editingTaskId = null;

// ── STORAGE KEYS ───────────────────────────────────────────────────────────────

function tasksKey()    { return `git2g_tasks_${currentUser.email}`; }
function settingsKey() { return `git2g_settings_${currentUser.email}`; }

function loadUserData() {
  try {
    const t = JSON.parse(localStorage.getItem(tasksKey()) || '[]');
    tasks = t;
    nextId = tasks.length ? Math.max(...tasks.map(t => t.id)) + 1 : 1;
  } catch { tasks = []; }

  try {
    const s = JSON.parse(localStorage.getItem(settingsKey()) || 'null');
    if (s) {
      notifSettings = { ...notifSettings, ...s.notifSettings };
      if (s.personality) setPersonalityQuiet(s.personality);
    }
  } catch {}
}

function saveUserData() {
  localStorage.setItem(tasksKey(), JSON.stringify(tasks));
  localStorage.setItem(settingsKey(), JSON.stringify({
    notifSettings,
    personality: currentPersonality,
  }));
}

// ── AUTH ───────────────────────────────────────────────────────────────────────

function logout() {
  localStorage.removeItem('git2g_current_user');
  window.location.href = 'auth.html';
}

function initUser() {
  try {
    currentUser = JSON.parse(localStorage.getItem('git2g_current_user') || 'null');
  } catch { currentUser = null; }
  if (!currentUser || !currentUser.email) {
    window.location.href = 'auth.html';
    return false;
  }
  document.getElementById('user-name').textContent = currentUser.name || currentUser.email.split('@')[0];
  document.getElementById('user-email').textContent = currentUser.email;
  document.getElementById('user-avatar').textContent = (currentUser.name || currentUser.email)[0].toUpperCase();
  return true;
}

// ── HELPERS ────────────────────────────────────────────────────────────────────

function makeDateStr(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().split('T')[0];
}

const today = new Date();
today.setHours(0, 0, 0, 0);

function daysUntil(s) {
  const d = new Date(s);
  d.setHours(0, 0, 0, 0);
  return Math.round((d - today) / 86400000);
}

function urgencyClass(days, done) {
  if (done) return 'done';
  if (days < 0) return 'overdue';
  if (days <= 2) return 'urgent';
  if (days <= 5) return 'soon';
  return 'ok';
}

function dueLabel(days, done) {
  if (done) return 'Done ✓';
  if (days < 0) return `${Math.abs(days)}d overdue`;
  if (days === 0) return 'Due today!';
  if (days === 1) return 'Due tomorrow';
  return `In ${days} days`;
}

function dueClass(days, done) {
  if (done) return 'due-ok';
  if (days < 0) return 'due-urgent';
  if (days <= 0) return 'due-urgent';
  if (days <= 5) return 'due-soon';
  return 'due-ok';
}

// ── OS NOTIFICATIONS ───────────────────────────────────────────────────────────

function getNotifPermission() {
  if (!('Notification' in window)) return 'unsupported';
  return Notification.permission;
}

async function requestOsPermission() {
  if (!('Notification' in window)) return;
  await Notification.requestPermission();
  saveUserData();
  renderContent();
}

function fireOsNotification(meme, taskText) {
  if (getNotifPermission() !== 'granted') return;
  const n = new Notification('GetIt2gether', {
    body: `${meme.bg} ${meme.top} / ${meme.bot}\n${taskText}`,
    tag: 'git2g-reminder',
    requireInteraction: false,
  });
  n.onclick = () => { window.focus(); n.close(); };
}

// ── PERSONALITY ────────────────────────────────────────────────────────────────

function setPersonalityQuiet(p) {
  const cfg = PERSONALITIES[p];
  if (!cfg) return;
  const body = document.body;
  Object.values(PERSONALITIES).forEach(v => { if (v.bodyClass) body.classList.remove(v.bodyClass); });
  if (cfg.bodyClass) body.classList.add(cfg.bodyClass);
  currentPersonality = p;
}

function setPersonality(p) {
  setPersonalityQuiet(p);
  const cfg = PERSONALITIES[p];
  document.getElementById('app-logo-name').textContent = cfg.logoName;
  document.getElementById('app-tagline').textContent = cfg.tagline;
  document.getElementById('topbar-greeting').textContent = cfg.greeting;
  document.getElementById('modal-title').textContent = cfg.modalTitle;
  document.querySelectorAll('.p-pill').forEach(el => el.classList.remove('active'));
  const pill = document.getElementById('pill-' + p);
  if (pill) pill.classList.add('active');
  updateCategoryLabels();
  saveUserData();
  renderContent();
}

function updateCategoryLabels() {
  CAT_KEYS.forEach(k => {
    const el = document.getElementById('nav-' + k + '-label');
    if (el) el.textContent = catLabel(k);
  });
}

  currentView = v;
  document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
  if (el) el.classList.add('active');
  const cfg = PERSONALITIES[currentPersonality];
  const catViews = { school: catLabel('school'), work: catLabel('work'), appts: catLabel('appts'), chores: catLabel('chores'), todo: catLabel('todo') };
  const titles = { dashboard: 'Dashboard', tasks: 'All Tasks', upcoming: 'Upcoming', notifs: 'Notifications', ...catViews };
  document.getElementById('view-title').textContent = titles[v] || v;
  if (v === 'notifs') document.getElementById('badge-notifs').textContent = '🔔';
  currentFilter = 'All';
  document.getElementById('content-area').scrollIntoView({ block: 'start', behavior: 'instant' });
  renderContent();
}

// ── MODAL ──────────────────────────────────────────────────────────────────────

function openModal(taskId) {
  editingTaskId = taskId || null;
  const cfg = PERSONALITIES[currentPersonality];

  // Update category options with current personality names
  const catSelect = document.getElementById('input-cat');
  catSelect.innerHTML = CAT_KEYS.map(k =>
    `<option value="${k}">${catLabel(k)}</option>`
  ).join('');

  if (editingTaskId) {
    const t = tasks.find(t => t.id === editingTaskId);
    document.getElementById('modal-title').textContent = 'Edit Task';
    document.getElementById('modal-save-label').textContent = 'Update Task';
    document.getElementById('input-name').value = t.name;
    catSelect.value = t.cat;
    document.getElementById('input-course').value = t.detail || '';
    document.getElementById('input-type').value = t.type;
    document.getElementById('input-due').value = t.due;
    document.getElementById('input-priority').value = t.priority;
  } else {
    document.getElementById('modal-title').textContent = cfg.modalTitle;
    document.getElementById('modal-save-label').textContent = 'Save Task';
    document.getElementById('input-name').value = '';
    document.getElementById('input-course').value = '';
    document.getElementById('input-due').value = makeDateStr(3);
    // Pre-select category based on current view
    if (CAT_KEYS.includes(currentView)) catSelect.value = currentView;
    else catSelect.value = 'todo';
  }

  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingTaskId = null;
}

function saveTask() {
  const name = document.getElementById('input-name').value.trim();
  if (!name) return;

  if (editingTaskId) {
    const t = tasks.find(t => t.id === editingTaskId);
    t.name     = name;
    t.cat      = document.getElementById('input-cat').value;
    t.detail   = document.getElementById('input-course').value || '';
    t.type     = document.getElementById('input-type').value;
    t.due      = document.getElementById('input-due').value;
    t.priority = document.getElementById('input-priority').value;
  } else {
    tasks.unshift({
      id:       nextId++,
      name,
      cat:      document.getElementById('input-cat').value,
      detail:   document.getElementById('input-course').value || '',
      type:     document.getElementById('input-type').value,
      due:      document.getElementById('input-due').value,
      priority: document.getElementById('input-priority').value,
      done:     false,
      createdAt: Date.now(),
    });
  }

  saveUserData();
  closeModal();
  renderContent();
}

function toggleDone(id) {
  const t = tasks.find(t => t.id === id);
  if (t) { t.done = !t.done; saveUserData(); renderContent(); }
}

function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  saveUserData();
  renderContent();
}

// ── RENDER HELPERS ──────────────────────────────────────────────────────────────

function renderTaskCard(t) {
  const days = daysUntil(t.due);
  const urg  = urgencyClass(days, t.done);
  const dl   = dueLabel(days, t.done);
  const dc   = dueClass(days, t.done);
  const catDisplay = catLabel(t.cat);
  return `
    <div class="task-card ${urg}">
      <div class="task-check ${t.done ? 'checked' : ''}" onclick="toggleDone(${t.id})">
        ${t.done ? '<i class="ti ti-check" style="font-size:11px;color:var(--p-bg)" aria-hidden="true"></i>' : ''}
      </div>
      <div class="task-info" onclick="toggleDone(${t.id})">
        <div class="task-name">${t.name}</div>
        <div class="task-meta">
          ${t.detail ? `<span class="task-course">${t.detail}</span>` : ''}
          <span class="task-type-badge">${t.type}</span>
          <span class="task-type-badge">${catDisplay}</span>
        </div>
      </div>
      <div class="task-right">
        <span class="task-due ${dc}">${dl}</span>
        <span style="font-size:10px;color:var(--p-muted)">${t.priority}</span>
        <div class="task-actions">
          <button class="task-action-btn" onclick="event.stopPropagation();openModal(${t.id})" title="Edit">
            <i class="ti ti-pencil" style="font-size:11px"></i>
          </button>
          <button class="task-action-btn danger" onclick="event.stopPropagation();deleteTask(${t.id})" title="Delete">
            <i class="ti ti-trash" style="font-size:11px"></i>
          </button>
        </div>
      </div>
    </div>`;
}

// ── NOTIFICATION SETTINGS RENDER ───────────────────────────────────────────────

function renderNotifSettings() {
  const perm = getNotifPermission();
  const permLabels = {
    granted:     { text: '✓ Granted',    cls: 'granted' },
    denied:      { text: '✗ Blocked',    cls: 'denied'  },
    default:     { text: '? Not asked',  cls: 'default' },
    unsupported: { text: '✗ Unsupported',cls: 'denied'  },
  };
  const pl = permLabels[perm] || permLabels.default;

  const permBanner = `
    <div class="notif-permission-banner">
      <div class="perm-icon">${perm === 'granted' ? '🔔' : perm === 'denied' ? '🔕' : '📲'}</div>
      <div class="perm-text">
        <div class="perm-title">Background Notifications
          <span class="perm-status-pill ${pl.cls}" style="margin-left:8px">${pl.text}</span>
        </div>
        <div class="perm-desc">${
          perm === 'granted'   ? "OS notifications active — you'll be alerted even when the tab is closed or minimized." :
          perm === 'denied'    ? 'Blocked. Click the lock icon in your browser bar and allow notifications for this site.' :
          perm === 'unsupported' ? "Your browser doesn't support push notifications." :
          'Allow push notifications so reminders reach you even when the app is in the background.'
        }</div>
      </div>
      ${perm === 'default' ? `<button class="btn btn-primary" style="flex-shrink:0;font-size:11px;padding:6px 12px" onclick="requestOsPermission()">Allow</button>` : ''}
    </div>`;

  const packCards = Object.entries(MEME_PACKS).map(([k, v]) => `
    <div class="meme-pack-card ${notifSettings.selectedPack === k ? 'selected' : ''}" onclick="selectPack('${k}')">
      <div class="pack-emoji">${v.emoji}</div>
      <div class="pack-name">${v.name}</div>
      <div class="pack-desc">${v.desc}</div>
    </div>`).join('');

  const intervals = [10, 30, 60, 120];
  const intervalBtns = intervals.map(i =>
    `<button class="interval-btn ${notifSettings.interval === i ? 'active' : ''}" onclick="setInterval2(${i})">${i < 60 ? i + 's' : i / 60 + 'h'}</button>`
  ).join('');

  const logItems = notifLog.slice(-5).reverse().map(l =>
    `<div class="log-item"><span class="log-time">${l.time}</span><span class="log-msg">${l.meme.bg} ${l.meme.bot}</span><span class="log-pack">${l.pack}</span></div>`
  ).join('');

  return `
    ${permBanner}
    <div class="section-header"><span class="section-title">🔔 Notification Settings</span><div class="section-sep"></div></div>
    <div class="settings-panel">
      <div class="settings-row">
        <div>
          <div class="settings-label">Enable in-app meme notifications</div>
          <div class="settings-sub">Get roasted into productivity (while app is open)</div>
        </div>
        <div class="toggle ${notifSettings.enabled ? 'on' : ''}" onclick="toggleSetting('enabled')"><div class="toggle-knob"></div></div>
      </div>
      <div class="settings-row">
        <div>
          <div class="settings-label">Background OS notifications</div>
          <div class="settings-sub">System alerts even when the app is closed${perm !== 'granted' ? ' — requires permission above' : ''}</div>
        </div>
        <div class="toggle ${notifSettings.osEnabled && perm === 'granted' ? 'on' : ''}" onclick="${perm === 'granted' ? "toggleSetting('osEnabled')" : 'requestOsPermission()'}"><div class="toggle-knob"></div></div>
      </div>
      <div class="settings-row">
        <div>
          <div class="settings-label">Urgent tasks only</div>
          <div class="settings-sub">Only notify for tasks due within 2 days</div>
        </div>
        <div class="toggle ${notifSettings.urgentOnly ? 'on' : ''}" onclick="toggleSetting('urgentOnly')"><div class="toggle-knob"></div></div>
      </div>
    </div>
    <div class="section-header" style="margin-top:4px"><span class="section-title">🎭 Choose Your Meme Pack</span><div class="section-sep"></div></div>
    <div class="meme-pack-grid">${packCards}</div>
    <div class="section-header"><span class="section-title">⏱ Reminder Interval</span><div class="section-sep"></div></div>
    <div class="settings-panel" style="padding:14px 18px">
      <div class="interval-row">${intervalBtns}</div>
    </div>
    <button class="preview-btn" onclick="fireRandomMeme()">
      <i class="ti ti-player-play" aria-hidden="true"></i> Preview a Notification Now
    </button>
    ${notifLog.length ? `
      <div class="section-header" style="margin-top:16px">
        <span class="section-title">📋 Recent Notifications</span><div class="section-sep"></div>
      </div>
      <div class="notif-log">${logItems}</div>` : ''}
  `;
}

// ── MAIN RENDER ────────────────────────────────────────────────────────────────

function renderContent() {
  const area = document.getElementById('content-area');
  const cfg  = PERSONALITIES[currentPersonality];
  const pending = tasks.filter(t => !t.done);
  const urgent  = pending.filter(t => daysUntil(t.due) <= 2);
  const done    = tasks.filter(t => t.done);
  const pct     = tasks.length ? Math.round(done.length / tasks.length * 100) : 0;

  // Update all sidebar badges
  document.getElementById('badge-all').textContent = pending.length;
  CAT_KEYS.forEach(k => {
    const b = document.getElementById('badge-' + k);
    if (b) b.textContent = pending.filter(t => t.cat === k).length;
  });

  if (currentView === 'notifs') {
    area.innerHTML = renderNotifSettings();
    return;
  }

  let html = '';

  if (currentView === 'dashboard') {
    const apptsPending = pending.filter(t => t.cat === 'appts').length;
    html += `
      <div class="stats-row">
        <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value stat-accent">${pending.length}</div><div class="stat-sub">tasks remaining</div></div>
        <div class="stat-card"><div class="stat-label">Urgent</div><div class="stat-value stat-danger">${urgent.length}</div><div class="stat-sub">due within 2 days</div></div>
        <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value stat-success">${done.length}</div><div class="stat-sub">${pct}% of all tasks</div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>
        <div class="stat-card"><div class="stat-label">${catLabel('appts')}</div><div class="stat-value stat-warn">${apptsPending}</div><div class="stat-sub">coming up</div></div>
      </div>
      <div class="motivation-banner"><i class="ti ti-sparkles banner-icon" aria-hidden="true"></i><span>${cfg.bannerMsg}</span></div>`;

    if (urgent.length) {
      html += `<div class="section-header"><span class="section-title">🚨 Urgent — Act Now</span><div class="section-sep"></div></div><div class="task-list">${urgent.map(renderTaskCard).join('')}</div>`;
    }

    CAT_KEYS.forEach(k => {
      const catTasks = pending.filter(t => t.cat === k && daysUntil(t.due) > 2).slice(0, 3);
      if (catTasks.length) {
        html += `<div class="section-header"><span class="section-title">${CAT_EMOJIS[k]} ${catLabel(k)}</span><div class="section-sep"></div></div><div class="task-list">${catTasks.map(renderTaskCard).join('')}</div>`;
      }
    });

    if (!tasks.length) {
      html += `<div class="empty-state"><i class="ti ti-mood-smile" style="font-size:28px;display:block;margin-bottom:8px" aria-hidden="true"></i>No tasks yet — add your first one!</div>`;
    }

  } else if (currentView === 'tasks' || currentView === 'upcoming') {
    const filterLabels = ['All', ...CAT_KEYS.map(k => catLabel(k))];
    const filterValues = ['All', ...CAT_KEYS];
    html += `<div class="filter-tabs">${filterLabels.map((f, i) =>
      `<div class="filter-tab ${currentFilter === filterValues[i] ? 'active' : ''}" onclick="currentFilter='${filterValues[i]}';renderContent()">${f}</div>`
    ).join('')}</div>`;

    let filtered = currentView === 'upcoming'
      ? tasks.filter(t => !t.done && daysUntil(t.due) >= 0).sort((a, b) => new Date(a.due) - new Date(b.due))
      : [...tasks];

    if (currentFilter !== 'All') filtered = filtered.filter(t => t.cat === currentFilter);

    if (!filtered.length) {
      html += `<div class="empty-state"><i class="ti ti-mood-smile" style="font-size:28px;display:block;margin-bottom:8px" aria-hidden="true"></i>Nothing here yet!</div>`;
    } else {
      const sections = [
        { label: 'Overdue',              items: filtered.filter(t => !t.done && daysUntil(t.due) < 0) },
        { label: 'Due Today & Tomorrow', items: filtered.filter(t => !t.done && daysUntil(t.due) >= 0 && daysUntil(t.due) <= 1) },
        { label: 'This Week',            items: filtered.filter(t => !t.done && daysUntil(t.due) >= 2 && daysUntil(t.due) <= 7) },
        { label: 'Later',                items: filtered.filter(t => !t.done && daysUntil(t.due) > 7) },
        { label: 'Completed',            items: filtered.filter(t => t.done) },
      ].filter(s => s.items.length);

      sections.forEach(s => {
        html += `<div class="section-header"><span class="section-title">${s.label}</span><div class="section-sep"></div></div>
                 <div class="task-list">${s.items.map(renderTaskCard).join('')}</div>`;
      });
    }

  } else if (CAT_KEYS.includes(currentView)) {
    const k = currentView;
    const catTasks = tasks.filter(t => t.cat === k);
    if (!catTasks.length) {
      html += `<div class="empty-state"><i class="ti ${CAT_ICONS[k]}" style="font-size:28px;display:block;margin-bottom:8px" aria-hidden="true"></i>No ${catLabel(k)} tasks yet.<br><button class="btn btn-primary" style="margin-top:12px" onclick="openModal()"><i class="ti ti-plus"></i> Add one</button></div>`;
    } else {
      const sections = [
        { label: 'Overdue',     items: catTasks.filter(t => !t.done && daysUntil(t.due) < 0) },
        { label: 'Coming Up',   items: catTasks.filter(t => !t.done && daysUntil(t.due) >= 0 && daysUntil(t.due) <= 7) },
        { label: 'Later',       items: catTasks.filter(t => !t.done && daysUntil(t.due) > 7) },
        { label: 'Completed',   items: catTasks.filter(t => t.done) },
      ].filter(s => s.items.length);
      sections.forEach(s => {
        html += `<div class="section-header"><span class="section-title">${s.label}</span><div class="section-sep"></div></div>
                 <div class="task-list">${s.items.map(renderTaskCard).join('')}</div>`;
      });
    }
  }

  area.innerHTML = html;
}

// ── NOTIFICATION CONTROLS ──────────────────────────────────────────────────────

function selectPack(k) { notifSettings.selectedPack = k; saveUserData(); renderContent(); }

function setInterval2(i) { notifSettings.interval = i; restartTimer(); saveUserData(); renderContent(); }

function toggleSetting(k) {
  notifSettings[k] = !notifSettings[k];
  if (k === 'enabled') notifSettings.enabled ? restartTimer() : clearInterval(notifTimer);
  saveUserData();
  renderContent();
}

// ── TOAST NOTIFICATIONS ────────────────────────────────────────────────────────

let toastCount = 0;

function fireRandomMeme() {
  if (!notifSettings.enabled) return;
  const pack = MEME_PACKS[notifSettings.selectedPack];
  const meme = pack.memes[Math.floor(Math.random() * pack.memes.length)];

  const pending = tasks.filter(t => !t.done);
  const urgentT = pending.filter(t => daysUntil(t.due) <= 2);
  const pool    = notifSettings.urgentOnly ? urgentT : pending;
  const rel     = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;

  const now = new Date();
  const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  notifLog.push({ time: timeStr, meme, pack: pack.name });

  const taskText = rel
    ? `"${rel.name}" ${daysUntil(rel.due) <= 0 ? 'is OVERDUE' : 'due ' + dueLabel(daysUntil(rel.due), false).toLowerCase()}`
    : 'You have tasks waiting on you...';

  if (notifSettings.osEnabled) fireOsNotification(meme, taskText);

  const id  = 'toast-' + (++toastCount);
  const bgColor = pack.color + '22';
  const borderAccent = pack.color;

  const html = `
    <div class="notif-toast" id="${id}">
      <div class="notif-header">
        <div class="notif-app-icon" style="background:${pack.color}">G</div>
        <span class="notif-app-name">GetIt2gether</span>
        <span class="notif-time">now</span>
        <button class="notif-dismiss" onclick="dismissToast('${id}')" aria-label="Dismiss"><i class="ti ti-x" style="font-size:12px"></i></button>
      </div>
      <div class="notif-meme-zone">
        <div class="meme-canvas" style="background:${bgColor};border:1.5px solid ${borderAccent}33">
          <div class="meme-bg">${meme.bg}</div>
          <div class="meme-top-text">${meme.top}</div>
          <div class="meme-bot-text">${meme.bot}</div>
        </div>
        <div class="notif-body-text">${taskText}</div>
      </div>
      <div class="notif-actions">
        <button class="notif-action" onclick="dismissToast('${id}');switchView('tasks',document.getElementById('nav-tasks'))">View Tasks</button>
        <button class="notif-action dismiss" onclick="dismissToast('${id}')">Dismiss</button>
      </div>
    </div>`;

  const container = document.getElementById('notif-container');
  container.insertAdjacentHTML('beforeend', html);
  const el = document.getElementById(id);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  setTimeout(() => dismissToast(id), 8000);
}

function dismissToast(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('hide');
  el.classList.remove('show');
  setTimeout(() => el.remove(), 300);
}

function restartTimer() {
  if (notifTimer) clearInterval(notifTimer);
  if (notifSettings.enabled) {
    notifTimer = setInterval(() => {
      const p = tasks.filter(t => !t.done);
      const u = p.filter(t => daysUntil(t.due) <= 2);
      if (notifSettings.urgentOnly && !u.length) return;
      if (p.length) fireRandomMeme();
    }, notifSettings.interval * 1000);
  }
}

// ── BOOT ───────────────────────────────────────────────────────────────────────

if (initUser()) {
  loadUserData();
  const cfg = PERSONALITIES[currentPersonality];
  document.getElementById('app-logo-name').textContent = cfg.logoName;
  document.getElementById('app-tagline').textContent   = cfg.tagline;
  document.getElementById('topbar-greeting').textContent = cfg.greeting;
  document.getElementById('modal-title').textContent   = cfg.modalTitle;
  document.body.className = cfg.bodyClass || '';
  const pill = document.getElementById('pill-' + currentPersonality);
  if (pill) pill.classList.add('active');
  updateCategoryLabels();
  renderContent();
  restartTimer();
  if (tasks.length > 0) setTimeout(() => fireRandomMeme(), 2200);
}
</script>
</body>

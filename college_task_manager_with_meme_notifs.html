
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&family=Instrument+Serif:ital@0;1&family=Nunito:wght@400;600;700;800;900&family=Bebas+Neue&family=Impact&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --p-bg:#0d0d14;--p-surface:#16161f;--p-card:#1e1e2a;--p-border:rgba(255,255,255,0.08);
    --p-accent:#7c6af7;--p-accent2:#e86af7;--p-text:#f0eeff;--p-muted:rgba(240,238,255,0.5);
    --p-danger:#f76a6a;--p-warn:#f7b76a;--p-success:#6af79e;
    --p-font-display:'Syne',sans-serif;--p-font-body:'DM Sans',sans-serif;
    --p-radius:14px;--p-radius-sm:8px;
  }
  .personality-zen{--p-bg:#f8f5f0;--p-surface:#fffefb;--p-card:#ffffff;--p-border:rgba(0,0,0,0.07);--p-accent:#7b9e7b;--p-accent2:#a8856a;--p-text:#2a2a2a;--p-muted:rgba(42,42,42,0.45);--p-danger:#c0614a;--p-warn:#c0934a;--p-success:#4a9060;--p-font-display:'Instrument Serif',serif;--p-font-body:'DM Sans',sans-serif}
  .personality-grind{--p-bg:#0a0a0a;--p-surface:#111;--p-card:#1a1a1a;--p-border:rgba(255,255,255,0.06);--p-accent:#39ff14;--p-accent2:#00d4ff;--p-text:#f0f0f0;--p-muted:rgba(240,240,240,0.4);--p-danger:#ff3939;--p-warn:#ffd700;--p-success:#39ff14;--p-font-display:'Bebas Neue',sans-serif;--p-font-body:'Space Mono',monospace}
  .personality-bubbly{--p-bg:#fff0f8;--p-surface:#fff5fb;--p-card:#ffffff;--p-border:rgba(255,100,200,0.12);--p-accent:#ff6ec7;--p-accent2:#a78bfa;--p-text:#2d1b4e;--p-muted:rgba(45,27,78,0.45);--p-danger:#ff4444;--p-warn:#ff9b2b;--p-success:#2ecc71;--p-font-display:'Nunito',sans-serif;--p-font-body:'Nunito',sans-serif}
  body{background:var(--p-bg);color:var(--p-text);font-family:var(--p-font-body);min-height:100vh;transition:all 0.4s ease;font-size:14px}
  .app-shell{display:grid;grid-template-columns:220px 1fr;min-height:640px;max-height:720px;overflow:hidden}
  .sidebar{background:var(--p-surface);border-right:0.5px solid var(--p-border);display:flex;flex-direction:column;padding:20px 0;overflow-y:auto}
  .app-logo{padding:0 18px 20px;border-bottom:0.5px solid var(--p-border);margin-bottom:16px}
  .logo-name{font-family:var(--p-font-display);font-size:20px;font-weight:700;color:var(--p-accent)}
  .logo-tagline{font-size:11px;color:var(--p-muted);margin-top:2px}
  .sidebar-section-label{font-size:10px;font-weight:600;letter-spacing:0.08em;color:var(--p-muted);padding:0 18px;margin-bottom:6px;text-transform:uppercase}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:13px;font-weight:500;color:var(--p-muted);cursor:pointer;border-left:2px solid transparent;transition:all 0.15s;font-family:var(--p-font-body)}
  .nav-item:hover{color:var(--p-text);background:rgba(255,255,255,0.03)}
  .nav-item.active{color:var(--p-accent);border-left-color:var(--p-accent);background:rgba(124,106,247,0.06)}
  .personality-zen .nav-item.active{background:rgba(123,158,123,0.08)}
  .personality-grind .nav-item.active{background:rgba(57,255,20,0.06)}
  .personality-bubbly .nav-item.active{background:rgba(255,110,199,0.08)}
  .nav-badge{margin-left:auto;font-size:10px;font-weight:700;background:var(--p-accent);color:var(--p-bg);border-radius:10px;padding:1px 6px;min-width:18px;text-align:center}
  .sidebar-spacer{flex:1}
  .personality-switcher{padding:14px 18px;border-top:0.5px solid var(--p-border)}
  .switcher-label{font-size:10px;font-weight:600;letter-spacing:0.08em;color:var(--p-muted);text-transform:uppercase;margin-bottom:8px}
  .personality-pills{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .p-pill{padding:6px 8px;border-radius:var(--p-radius-sm);border:0.5px solid var(--p-border);cursor:pointer;font-size:11px;font-weight:600;text-align:center;transition:all 0.2s;color:var(--p-muted);background:transparent;font-family:var(--p-font-body)}
  .p-pill:hover{border-color:var(--p-accent);color:var(--p-text)}
  .p-pill.active{background:var(--p-accent);color:var(--p-bg);border-color:var(--p-accent);font-weight:700}
  .main{display:flex;flex-direction:column;overflow:hidden;background:var(--p-bg)}
  .topbar{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:0.5px solid var(--p-border);background:var(--p-surface)}
  .topbar-title{font-family:var(--p-font-display);font-size:17px;font-weight:700;color:var(--p-text);flex:1}
  .topbar-greeting{font-size:12px;color:var(--p-muted);font-style:italic}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--p-radius-sm);font-size:12px;font-weight:600;cursor:pointer;border:0.5px solid var(--p-border);font-family:var(--p-font-body);transition:all 0.15s;color:var(--p-muted);background:transparent}
  .btn:hover{color:var(--p-text);border-color:var(--p-accent)}
  .btn-primary{background:var(--p-accent);color:var(--p-bg);border-color:var(--p-accent);font-weight:700}
  .btn-primary:hover{opacity:0.88}
  .btn-notif{background:var(--p-warn);color:#1a1000;border-color:var(--p-warn);font-weight:700}
  .btn-notif:hover{opacity:0.88}
  .content-area{flex:1;overflow-y:auto;padding:18px 22px}
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  .stat-card{background:var(--p-card);border:0.5px solid var(--p-border);border-radius:var(--p-radius);padding:12px 14px}
  .stat-label{font-size:11px;color:var(--p-muted);margin-bottom:4px}
  .stat-value{font-size:22px;font-weight:700;font-family:var(--p-font-display);color:var(--p-text)}
  .stat-sub{font-size:11px;color:var(--p-muted);margin-top:2px}
  .stat-accent{color:var(--p-accent)}.stat-danger{color:var(--p-danger)}.stat-warn{color:var(--p-warn)}.stat-success{color:var(--p-success)}
  .section-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .section-title{font-family:var(--p-font-display);font-size:14px;font-weight:700;color:var(--p-text)}
  .section-sep{flex:1;height:0.5px;background:var(--p-border)}
  .task-list{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
  .task-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--p-card);border:0.5px solid var(--p-border);border-radius:var(--p-radius);padding:11px 14px;cursor:pointer;transition:all 0.15s;border-left:3px solid transparent}
  .task-card:hover{border-color:var(--p-accent);transform:translateX(2px)}
  .task-card.urgent{border-left-color:var(--p-danger)}.task-card.soon{border-left-color:var(--p-warn)}.task-card.ok{border-left-color:var(--p-success)}.task-card.done{opacity:0.4}.task-card.done .task-name{text-decoration:line-through}
  .task-check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--p-border);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:transparent}
  .task-check.checked{background:var(--p-success);border-color:var(--p-success)}
  .task-info{min-width:0}
  .task-name{font-size:13px;font-weight:600;color:var(--p-text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task-meta{display:flex;align-items:center;gap:8px}
  .task-course{font-size:11px;color:var(--p-accent);font-weight:600}
  .task-type-badge{font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;border:0.5px solid var(--p-border);color:var(--p-muted)}
  .task-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .task-due{font-size:11px;font-weight:600;white-space:nowrap}
  .due-urgent{color:var(--p-danger)}.due-soon{color:var(--p-warn)}.due-ok{color:var(--p-success)}
  .progress-bar{height:4px;background:var(--p-border);border-radius:4px;margin-top:6px;overflow:hidden}
  .progress-fill{height:100%;background:var(--p-accent);border-radius:4px;transition:width 0.4s ease}
  .filter-tabs{display:flex;gap:6px;margin-bottom:12px}
  .filter-tab{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:0.5px solid var(--p-border);color:var(--p-muted);background:transparent;font-family:var(--p-font-body);transition:all 0.15s}
  .filter-tab:hover{color:var(--p-text)}
  .filter-tab.active{background:var(--p-accent);color:var(--p-bg);border-color:var(--p-accent)}
  .motivation-banner{background:var(--p-card);border:0.5px solid var(--p-border);border-radius:var(--p-radius);padding:12px 16px;margin-bottom:18px;border-left:3px solid var(--p-accent);font-size:13px;color:var(--p-muted);font-style:italic;display:flex;align-items:center;gap:10px}
  .banner-icon{font-size:18px;color:var(--p-accent);flex-shrink:0}
  .empty-state{text-align:center;padding:28px 0;color:var(--p-muted);font-size:13px}

  /* ── NOTIFICATION TOAST ── */
  .notif-container{position:absolute;top:14px;right:14px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:300px}
  .notif-toast{background:var(--p-card);border:0.5px solid var(--p-border);border-radius:16px;padding:0;overflow:hidden;pointer-events:all;transform:translateX(120%);transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);width:290px}
  .notif-toast.show{transform:translateX(0)}
  .notif-toast.hide{transform:translateX(120%);transition:transform 0.25s ease-in}
  .notif-header{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;border-bottom:0.5px solid var(--p-border)}
  .notif-app-icon{width:22px;height:22px;border-radius:6px;background:var(--p-accent);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--p-bg);font-weight:700}
  .notif-app-name{font-size:11px;font-weight:700;color:var(--p-muted);letter-spacing:0.04em;text-transform:uppercase}
  .notif-time{font-size:10px;color:var(--p-muted);margin-left:auto}
  .notif-dismiss{background:none;border:none;color:var(--p-muted);cursor:pointer;font-size:14px;padding:0;line-height:1}
  .notif-meme-zone{padding:10px 12px 0;text-align:center}
  .meme-canvas{width:100%;height:110px;border-radius:10px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
  .meme-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px}
  .meme-top-text{position:absolute;top:6px;left:0;right:0;text-align:center;font-family:'Impact',sans-serif;font-size:15px;font-weight:900;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;letter-spacing:0.04em;padding:0 8px;z-index:2}
  .meme-bot-text{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:'Impact',sans-serif;font-size:15px;font-weight:900;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;letter-spacing:0.04em;padding:0 8px;z-index:2}
  .notif-body-text{font-size:12px;font-weight:600;color:var(--p-text);text-align:center;padding:0 4px 10px;line-height:1.4}
  .notif-actions{display:grid;grid-template-columns:1fr 1fr;border-top:0.5px solid var(--p-border)}
  .notif-action{padding:9px;font-size:12px;font-weight:600;text-align:center;cursor:pointer;color:var(--p-accent);border:none;background:none;font-family:var(--p-font-body);transition:background 0.1s}
  .notif-action:hover{background:rgba(124,106,247,0.08)}
  .notif-action.dismiss{color:var(--p-muted);border-left:0.5px solid var(--p-border)}

  /* ── NOTIF SETTINGS PANEL ── */
  .settings-panel{background:var(--p-card);border:0.5px solid var(--p-border);border-radius:var(--p-radius);padding:18px;margin-bottom:16px}
  .settings-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .settings-label{font-size:13px;color:var(--p-text);font-weight:600;flex:1}
  .settings-sub{font-size:11px;color:var(--p-muted);margin-top:2px}
  .toggle{width:38px;height:22px;border-radius:11px;border:0.5px solid var(--p-border);background:var(--p-surface);cursor:pointer;position:relative;transition:background 0.2s;flex-shrink:0}
  .toggle.on{background:var(--p-accent);border-color:var(--p-accent)}
  .toggle-knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--p-muted);transition:all 0.2s}
  .toggle.on .toggle-knob{left:19px;background:var(--p-bg)}
  .meme-pack-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .meme-pack-card{border:1.5px solid var(--p-border);border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer;transition:all 0.2s;background:transparent}
  .meme-pack-card.selected{border-color:var(--p-accent);background:rgba(124,106,247,0.08)}
  .meme-pack-card:hover{border-color:var(--p-accent)}
  .pack-emoji{font-size:22px;margin-bottom:4px}
  .pack-name{font-size:11px;font-weight:700;color:var(--p-text)}
  .pack-desc{font-size:10px;color:var(--p-muted);margin-top:2px}
  .interval-row{display:flex;align-items:center;gap:10px}
  .interval-btn{padding:6px 12px;border-radius:var(--p-radius-sm);border:0.5px solid var(--p-border);font-size:12px;font-weight:600;cursor:pointer;color:var(--p-muted);background:transparent;font-family:var(--p-font-body);transition:all 0.15s}
  .interval-btn.active{background:var(--p-accent);color:var(--p-bg);border-color:var(--p-accent)}
  .preview-btn{width:100%;padding:10px;border-radius:var(--p-radius-sm);border:0.5px solid var(--p-accent);background:transparent;color:var(--p-accent);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--p-font-body);transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
  .preview-btn:hover{background:var(--p-accent);color:var(--p-bg)}
  .notif-log{display:flex;flex-direction:column;gap:6px;margin-top:12px}
  .log-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--p-surface);border-radius:var(--p-radius-sm);font-size:12px}
  .log-time{color:var(--p-muted);font-size:10px;min-width:42px}
  .log-msg{color:var(--p-text);flex:1}
  .log-pack{font-size:10px;color:var(--p-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.05em}

  .modal-overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal{background:var(--p-card);border:0.5px solid var(--p-border);border-radius:var(--p-radius);padding:22px;width:340px;max-width:95%}
  .modal-title{font-family:var(--p-font-display);font-size:16px;font-weight:700;color:var(--p-text);margin-bottom:16px}
  .form-group{margin-bottom:12px}
  .form-label{font-size:11px;color:var(--p-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px;display:block}
  .form-input,.form-select{width:100%;background:var(--p-surface);border:0.5px solid var(--p-border);border-radius:var(--p-radius-sm);color:var(--p-text);padding:8px 10px;font-size:13px;font-family:var(--p-font-body);outline:none;transition:border-color 0.15s}
  .form-input:focus,.form-select:focus{border-color:var(--p-accent)}
  .form-select option{background:#1e1e2a}
  .modal-actions{display:flex;gap:8px;margin-top:16px}
  ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--p-border);border-radius:4px}
</style>
</head>
<body>

<div style="position:relative;overflow:hidden">
<div class="app-shell">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="app-logo">
      <div class="logo-name" id="app-logo-name">Deadline</div>
      <div class="logo-tagline" id="app-tagline">your academic co-pilot</div>
    </div>
    <div class="sidebar-section-label" style="margin-bottom:8px">Overview</div>
    <div class="nav-item active" id="nav-dashboard" onclick="switchView('dashboard',this)"><i class="ti ti-layout-dashboard" aria-hidden="true"></i> Dashboard</div>
    <div class="nav-item" id="nav-tasks" onclick="switchView('tasks',this)"><i class="ti ti-checklist" aria-hidden="true"></i> All Tasks <span class="nav-badge" id="badge-all">0</span></div>
    <div class="nav-item" id="nav-upcoming" onclick="switchView('upcoming',this)"><i class="ti ti-calendar-event" aria-hidden="true"></i> Upcoming</div>
    <div class="nav-item" id="nav-work" onclick="switchView('work',this)"><i class="ti ti-briefcase" aria-hidden="true"></i> Work Shifts</div>
    <div class="nav-item" id="nav-notifs" onclick="switchView('notifs',this)"><i class="ti ti-bell" aria-hidden="true"></i> Notifications <span class="nav-badge" style="background:var(--p-warn);color:#1a1000" id="badge-notifs">NEW</span></div>
    <div class="sidebar-spacer"></div>
    <div class="personality-switcher">
      <div class="switcher-label">Vibe</div>
      <div class="personality-pills">
        <div class="p-pill active" onclick="setPersonality('default')" id="pill-default">🌌 Night Owl</div>
        <div class="p-pill" onclick="setPersonality('zen')" id="pill-zen">🌿 Zen Mode</div>
        <div class="p-pill" onclick="setPersonality('grind')" id="pill-grind">⚡ Grind Set</div>
        <div class="p-pill" onclick="setPersonality('bubbly')" id="pill-bubbly">🌸 Bubbly</div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="view-title">Dashboard</div>
      <div class="topbar-greeting" id="topbar-greeting">Hey, you've got this 👊</div>
      <button class="btn btn-notif" onclick="fireRandomMeme()" style="margin-right:4px">
        <i class="ti ti-bell" aria-hidden="true"></i> Test Notif
      </button>
      <button class="btn btn-primary" onclick="openModal()">
        <i class="ti ti-plus" aria-hidden="true"></i> Add Task
      </button>
    </div>
    <div class="content-area" id="content-area"></div>
  </div>
</div>

<!-- Notification container -->
<div class="notif-container" id="notif-container"></div>

<!-- Add Task Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="modal-title">Add New Task</div>
    <div class="form-group"><label class="form-label">Task Name</label><input class="form-input" id="input-name" placeholder="e.g. Research Paper Draft"/></div>
    <div class="form-group"><label class="form-label">Category</label><select class="form-select" id="input-cat"><option>School</option><option>Work</option><option>Personal</option></select></div>
    <div class="form-group"><label class="form-label">Course / Job</label><input class="form-input" id="input-course" placeholder="e.g. PSYCH 201 or Café Shift"/></div>
    <div class="form-group"><label class="form-label">Type</label><select class="form-select" id="input-type"><option>Assignment</option><option>Exam</option><option>Quiz</option><option>Project</option><option>Reading</option><option>Work Shift</option><option>Other</option></select></div>
    <div class="form-group"><label class="form-label">Due Date</label><input class="form-input" type="date" id="input-due"/></div>
    <div class="form-group"><label class="form-label">Priority</label><select class="form-select" id="input-priority"><option>High</option><option>Medium</option><option>Low</option></select></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()" style="flex:1">Cancel</button>
      <button class="btn btn-primary" onclick="saveTask()" style="flex:2"><i class="ti ti-check" aria-hidden="true"></i> Save Task</button>
    </div>
  </div>
</div>
</div>

<script>
const PERSONALITIES={
  default:{bodyClass:'',logoName:'Deadline',tagline:'your academic co-pilot',greeting:"Hey, you've got this 👊",bannerMsg:"Every task completed is a step closer to who you're becoming.",modalTitle:'Add New Task'},
  zen:{bodyClass:'personality-zen',logoName:'Serenely',tagline:'breathe, focus, flow',greeting:'A calm mind moves mountains 🌿',bannerMsg:"You don't have to do everything at once. Begin with one breath, one task.",modalTitle:'What needs doing?'},
  grind:{bodyClass:'personality-grind',logoName:'GRINDSET',tagline:'NO DAYS OFF',greeting:'LOCK IN. CLOCK IN. ⚡',bannerMsg:'YOUR FUTURE SELF IS WATCHING. MAKE THEM PROUD.',modalTitle:'ADD A NEW MISSION'},
  bubbly:{bodyClass:'personality-bubbly',logoName:'Sparkle ✨',tagline:'tasks are cute, actually',greeting:"You're doing amazing, sweetie 🌸",bannerMsg:'Checking off tasks is like collecting little wins — you deserve them all! 🎀',modalTitle:"Add a cute lil' task!"},
};

let currentPersonality='default';
let currentView='dashboard';
let currentFilter='All';
let notifSettings={
  enabled:true,
  interval:30,
  selectedPack:'chaos',
  urgentOnly:false,
  sound:false,
};
let notifLog=[];
let notifTimer=null;
let nextId=100;
let tasks=[];

function makeDateStr(o){const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().split('T')[0]}
const today=new Date();today.setHours(0,0,0,0);
function daysUntil(s){const d=new Date(s);d.setHours(0,0,0,0);return Math.round((d-today)/86400000)}
function urgencyClass(days,done){if(done)return'done';if(days<=0)return'urgent';if(days<=2)return'urgent';if(days<=5)return'soon';return'ok'}
function dueLabel(days,done){if(done)return'Done ✓';if(days<0)return`${Math.abs(days)}d overdue`;if(days===0)return'Due today!';if(days===1)return'Due tomorrow';return`In ${days} days`}
function dueClass(days,done){if(done)return'due-ok';if(days<=0)return'due-urgent';if(days<=5)return'due-soon';return'due-ok'}

function initTasks(){
  tasks=[
    {id:1,name:'Research Paper Draft',cat:'School',course:'ENG 302',type:'Assignment',due:makeDateStr(1),priority:'High',done:false},
    {id:2,name:'Midterm Exam Study Guide',cat:'School',course:'CHEM 201',type:'Exam',due:makeDateStr(3),priority:'High',done:false},
    {id:3,name:'Group Project Slides',cat:'School',course:'BUS 450',type:'Project',due:makeDateStr(5),priority:'Medium',done:false},
    {id:4,name:'Evening Café Shift',cat:'Work',course:'Campus Café',type:'Work Shift',due:makeDateStr(0),priority:'High',done:false},
    {id:5,name:'Reading Ch. 7-9',cat:'School',course:'PSYCH 110',type:'Reading',due:makeDateStr(7),priority:'Low',done:true},
    {id:6,name:'Weekly Quiz',cat:'School',course:'STAT 200',type:'Quiz',due:makeDateStr(-1),priority:'High',done:false},
    {id:7,name:'Saturday Open Shift',cat:'Work',course:'Target',type:'Work Shift',due:makeDateStr(6),priority:'Medium',done:false},
    {id:8,name:'Lab Report',cat:'School',course:'BIO 105',type:'Assignment',due:makeDateStr(9),priority:'Medium',done:false},
  ];
}

function setPersonality(p){
  const body=document.body;
  Object.values(PERSONALITIES).forEach(v=>{if(v.bodyClass)body.classList.remove(v.bodyClass)});
  const cfg=PERSONALITIES[p];
  if(cfg.bodyClass)body.classList.add(cfg.bodyClass);
  currentPersonality=p;
  document.getElementById('app-logo-name').textContent=cfg.logoName;
  document.getElementById('app-tagline').textContent=cfg.tagline;
  document.getElementById('topbar-greeting').textContent=cfg.greeting;
  document.getElementById('modal-title').textContent=cfg.modalTitle;
  document.querySelectorAll('.p-pill').forEach(el=>el.classList.remove('active'));
  document.getElementById('pill-'+p).classList.add('active');
  renderContent();
}

function switchView(v,el){
  currentView=v;
  document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
  if(el)el.classList.add('active');
  const titles={dashboard:'Dashboard',tasks:'All Tasks',upcoming:'Upcoming',work:'Work Shifts',notifs:'Notifications'};
  document.getElementById('view-title').textContent=titles[v]||v;
  if(v==='notifs')document.getElementById('badge-notifs').textContent='🔔';
  currentFilter='All';
  renderContent();
}

function openModal(){document.getElementById('modal-overlay').classList.add('open');document.getElementById('input-due').value=makeDateStr(3)}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open')}
function saveTask(){
  const name=document.getElementById('input-name').value.trim();
  if(!name)return;
  tasks.unshift({id:nextId++,name,cat:document.getElementById('input-cat').value,course:document.getElementById('input-course').value||'—',type:document.getElementById('input-type').value,due:document.getElementById('input-due').value,priority:document.getElementById('input-priority').value,done:false});
  document.getElementById('input-name').value='';document.getElementById('input-course').value='';
  closeModal();renderContent();
}
function toggleDone(id){const t=tasks.find(t=>t.id===id);if(t){t.done=!t.done;renderContent()}}

function renderTaskCard(t){
  const days=daysUntil(t.due),urg=urgencyClass(days,t.done),dl=dueLabel(days,t.done),dc=dueClass(days,t.done);
  return`<div class="task-card ${urg}" onclick="toggleDone(${t.id})"><div class="task-check ${t.done?'checked':''}">${t.done?'<i class="ti ti-check" style="font-size:11px;color:var(--p-bg)" aria-hidden="true"></i>':''}</div><div class="task-info"><div class="task-name">${t.name}</div><div class="task-meta"><span class="task-course">${t.course}</span><span class="task-type-badge">${t.type}</span><span class="task-type-badge">${t.cat}</span></div></div><div class="task-right"><span class="task-due ${dc}">${dl}</span><span style="font-size:10px;color:var(--p-muted)">${t.priority} priority</span></div></div>`;
}

function renderNotifSettings(){
  const pack=MEME_PACKS[notifSettings.selectedPack];
  const packCards=Object.entries(MEME_PACKS).map(([k,v])=>`
    <div class="meme-pack-card ${notifSettings.selectedPack===k?'selected':''}" onclick="selectPack('${k}')">
      <div class="pack-emoji">${v.emoji}</div>
      <div class="pack-name">${v.name}</div>
      <div class="pack-desc">${v.desc}</div>
    </div>`).join('');

  const intervals=[10,30,60,120];
  const intervalBtns=intervals.map(i=>`<button class="interval-btn ${notifSettings.interval===i?'active':''}" onclick="setInterval2(${i})">${i<60?i+'m':i/60+'h'}</button>`).join('');

  const logItems=notifLog.slice(-5).reverse().map(l=>`<div class="log-item"><span class="log-time">${l.time}</span><span class="log-msg">${l.meme.bg} ${l.meme.bot}</span><span class="log-pack">${l.pack}</span></div>`).join('');

  return`
    <div class="section-header"><span class="section-title">🔔 Notification Settings</span><div class="section-sep"></div></div>
    <div class="settings-panel">
      <div class="settings-row">
        <div><div class="settings-label">Enable meme notifications</div><div class="settings-sub">Get roasted into productivity</div></div>
        <div class="toggle ${notifSettings.enabled?'on':''}" onclick="toggleSetting('enabled')"><div class="toggle-knob"></div></div>
      </div>
      <div class="settings-row">
        <div><div class="settings-label">Urgent tasks only</div><div class="settings-sub">Only notify for tasks due within 2 days</div></div>
        <div class="toggle ${notifSettings.urgentOnly?'on':''}" onclick="toggleSetting('urgentOnly')"><div class="toggle-knob"></div></div>
      </div>
    </div>

    <div class="section-header" style="margin-top:4px"><span class="section-title">🎭 Choose Your Meme Pack</span><div class="section-sep"></div></div>
    <div class="meme-pack-grid">${packCards}</div>

    <div class="section-header"><span class="section-title">⏱ Reminder Interval</span><div class="section-sep"></div></div>
    <div class="settings-panel" style="padding:14px 18px">
      <div class="interval-row">${intervalBtns}</div>
    </div>

    <button class="preview-btn" onclick="fireRandomMeme()">
      <i class="ti ti-player-play" aria-hidden="true"></i> Preview a Notification Now
    </button>

    ${notifLog.length?`<div class="section-header" style="margin-top:16px"><span class="section-title">📋 Recent Notifications</span><div class="section-sep"></div></div><div class="notif-log">${logItems}</div>`:''}
  `;
}

function renderContent(){
  const area=document.getElementById('content-area');
  const cfg=PERSONALITIES[currentPersonality];
  const pending=tasks.filter(t=>!t.done);
  const urgent=pending.filter(t=>daysUntil(t.due)<=2);
  const done=tasks.filter(t=>t.done);
  const pct=tasks.length?Math.round(done.length/tasks.length*100):0;
  document.getElementById('badge-all').textContent=pending.length;

  if(currentView==='notifs'){area.innerHTML=renderNotifSettings();return}

  let html='';
  if(currentView==='dashboard'){
    html+=`<div class="stats-row">
      <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value stat-accent">${pending.length}</div><div class="stat-sub">tasks remaining</div></div>
      <div class="stat-card"><div class="stat-label">Urgent</div><div class="stat-value stat-danger">${urgent.length}</div><div class="stat-sub">due within 2 days</div></div>
      <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value stat-success">${done.length}</div><div class="stat-sub">${pct}% of all tasks</div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>
      <div class="stat-card"><div class="stat-label">Work Shifts</div><div class="stat-value stat-warn">${pending.filter(t=>t.cat==='Work').length}</div><div class="stat-sub">scheduled</div></div>
    </div>
    <div class="motivation-banner"><i class="ti ti-sparkles banner-icon" aria-hidden="true"></i><span>${cfg.bannerMsg}</span></div>`;
    if(urgent.length){html+=`<div class="section-header"><span class="section-title">🚨 Urgent — Act Now</span><div class="section-sep"></div></div><div class="task-list">${urgent.map(renderTaskCard).join('')}</div>`}
    const school=pending.filter(t=>t.cat==='School'&&daysUntil(t.due)>2).slice(0,3);
    if(school.length){html+=`<div class="section-header"><span class="section-title">📚 School Deadlines</span><div class="section-sep"></div></div><div class="task-list">${school.map(renderTaskCard).join('')}</div>`}
    const work=pending.filter(t=>t.cat==='Work').slice(0,2);
    if(work.length){html+=`<div class="section-header"><span class="section-title">💼 Work Shifts</span><div class="section-sep"></div></div><div class="task-list">${work.map(renderTaskCard).join('')}</div>`}
  } else if(currentView==='tasks'||currentView==='upcoming'){
    const filters=['All','School','Work','Personal'];
    html+=`<div class="filter-tabs">${filters.map(f=>`<div class="filter-tab ${currentFilter===f?'active':''}" onclick="currentFilter='${f}';renderContent()">${f}</div>`).join('')}</div>`;
    let filtered=currentView==='upcoming'?tasks.filter(t=>!t.done&&daysUntil(t.due)>=0).sort((a,b)=>new Date(a.due)-new Date(b.due)):tasks;
    if(currentFilter!=='All')filtered=filtered.filter(t=>t.cat===currentFilter);
    if(!filtered.length){html+=`<div class="empty-state"><i class="ti ti-mood-smile" style="font-size:28px;display:block;margin-bottom:8px" aria-hidden="true"></i>Nothing here yet!</div>`}
    else{
      const sections=[
        {label:'Overdue',items:filtered.filter(t=>!t.done&&daysUntil(t.due)<0)},
        {label:'Due Today & Tomorrow',items:filtered.filter(t=>!t.done&&daysUntil(t.due)>=0&&daysUntil(t.due)<=1)},
        {label:'This Week',items:filtered.filter(t=>!t.done&&daysUntil(t.due)>=2&&daysUntil(t.due)<=7)},
        {label:'Later',items:filtered.filter(t=>!t.done&&daysUntil(t.due)>7)},
        {label:'Completed',items:filtered.filter(t=>t.done)},
      ].filter(s=>s.items.length);
      sections.forEach(s=>{html+=`<div class="section-header"><span class="section-title">${s.label}</span><div class="section-sep"></div></div><div class="task-list">${s.items.map(renderTaskCard).join('')}</div>`});
    }
  } else if(currentView==='work'){
    const w=tasks.filter(t=>t.cat==='Work');
    if(!w.length){html+=`<div class="empty-state"><i class="ti ti-briefcase" style="font-size:28px;display:block;margin-bottom:8px" aria-hidden="true"></i>No work shifts yet.</div>`}
    else{html+=`<div class="section-header"><span class="section-title">Work Schedule</span><div class="section-sep"></div></div><div class="task-list">${w.sort((a,b)=>new Date(a.due)-new Date(b.due)).map(renderTaskCard).join('')}</div>`}
  }
  area.innerHTML=html;
}

function selectPack(k){
  notifSettings.selectedPack=k;
  renderContent();
}

function setInterval2(i){
  notifSettings.interval=i;
  restartTimer();
  renderContent();
}

function toggleSetting(k){
  notifSettings[k]=!notifSettings[k];
  if(k==='enabled'){notifSettings.enabled?restartTimer():clearInterval(notifTimer)}
  renderContent();
}

let toastCount=0;
function fireRandomMeme(task){
  if(!notifSettings.enabled)return;
  const pack=MEME_PACKS[notifSettings.selectedPack];
  const meme=pack.memes[Math.floor(Math.random()*pack.memes.length)];

  const pending=tasks.filter(t=>!t.done);
  const urgent=pending.filter(t=>daysUntil(t.due)<=2);
  const targetTasks=notifSettings.urgentOnly?urgent:pending;
  const relatedTask=targetTasks.length?targetTasks[Math.floor(Math.random()*targetTasks.length)]:null;

  const now=new Date();
  const timeStr=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  notifLog.push({time:timeStr,meme,pack:pack.name});

  const id='toast-'+(++toastCount);
  const bgColor=pack.color+'22';
  const borderAccent=pack.color;

  const html=`
    <div class="notif-toast" id="${id}">
      <div class="notif-header">
        <div class="notif-app-icon" style="background:${pack.color}">D</div>
        <span class="notif-app-name">Deadline</span>
        <span class="notif-time">now</span>
        <button class="notif-dismiss" onclick="dismissToast('${id}')" aria-label="Dismiss"><i class="ti ti-x" style="font-size:12px"></i></button>
      </div>
      <div class="notif-meme-zone">
        <div class="meme-canvas" style="background:${bgColor};border:1.5px solid ${borderAccent}33">
          <div class="meme-bg">${meme.bg}</div>
          <div class="meme-top-text">${meme.top}</div>
          <div class="meme-bot-text">${meme.bot}</div>
        </div>
        <div class="notif-body-text">${relatedTask?`"${relatedTask.name}" ${daysUntil(relatedTask.due)<=0?'is OVERDUE':'due '+dueLabel(daysUntil(relatedTask.due),false).toLowerCase()}`:'You have tasks waiting on you...'}</div>
      </div>
      <div class="notif-actions">
        <button class="notif-action" onclick="dismissToast('${id}');switchView('tasks',document.getElementById('nav-tasks'))">View Tasks</button>
        <button class="notif-action dismiss" onclick="dismissToast('${id}')">Dismiss</button>
      </div>
    </div>`;

  const container=document.getElementById('notif-container');
  container.insertAdjacentHTML('beforeend',html);
  const el=document.getElementById(id);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  setTimeout(()=>dismissToast(id),8000);
}

function dismissToast(id){
  const el=document.getElementById(id);
  if(!el)return;
  el.classList.add('hide');
  el.classList.remove('show');
  setTimeout(()=>el.remove(),300);
}

function restartTimer(){
  if(notifTimer)clearInterval(notifTimer);
  if(notifSettings.enabled){
    notifTimer=setInterval(()=>{
      const pending=tasks.filter(t=>!t.done);
      const urgent=pending.filter(t=>daysUntil(t.due)<=2);
      if(notifSettings.urgentOnly&&!urgent.length)return;
      if(pending.length)fireRandomMeme();
    },notifSettings.interval*1000);
  }
}

initTasks();
renderContent();
restartTimer();

setTimeout(()=>fireRandomMeme(),2200);
</script>
